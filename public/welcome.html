<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Доступ разрешен</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="welcome-page">

    <div class="welcome-container">
        <div class="welcome-icon">✅</div>
        
        <h1 class="welcome-title">Приветствую!</h1>
        
        <p class="welcome-text">
            Вы успешно авторизованы в сети <strong>MegaNet</strong>.<br>
            Теперь у вас есть доступ к высокоскоростному интернету.
        </p>

        <div class="status-badge">
            <span class="dot"></span> Вы в сети
        </div>

        <!-- Кнопка выхода (опционально, но полезно для тестов) -->
        <a href="/logout" class="btn btn-outline" style="margin-top: 30px; display: inline-block;">Выйти из сети</a>
    </div>

    <!-- Скрипт трекера для отслеживания времени выхода и действий на странице -->
    <script src="js/tracker.js"></script>
</body>
</html>

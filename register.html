<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Регистрация в сети WiFi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="back-link">← На главную</a>
            <div class="logo">
                <span class="logo-icon">📶</span>
                <span class="logo-text">MegaNet</span>
            </div>
            <h2>Создание аккаунта</h2>
            <p>Заполните форму для получения доступа к сети</p>
        </div>

        <!-- Форма отправляет данные на наш будущий API -->
        <form id="registerForm" class="auth-form" action="/api/auth/register" method="POST">
            
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Придумайте надежный пароль" minlength="6" required>
            </div>

            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="consent" name="consent" required>
                    <span class="checkmark"></span>
                    <span class="text">
                        Я даю согласие на <a href="#" target="_blank">обработку персональных данных</a> и сбор технической информации о моем устройстве (IP, отпечаток браузера) в целях обеспечения безопасности сети.
                    </span>
                </label>
            </div>

            <!-- Скрытое поле для передачи отпечатка устройства (заполнится через JS) -->
            <input type="hidden" id="fingerprint" name="fingerprint" value="">

            <button type="submit" class="btn btn-large btn-primary btn-block">Зарегистрироваться и войти</button>
        </form>

        <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </div>
    </div>

    <!-- Подключаем скрипты -->
    <script src="js/fingerprint.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
